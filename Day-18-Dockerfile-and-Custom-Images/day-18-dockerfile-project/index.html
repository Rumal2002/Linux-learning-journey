<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Day 18</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
            background: #1e293b;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #0ea5e9;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐳 Hello from Docker!</h1>

        <p>
            This static website is running inside a custom Nginx Docker container.
        </p>

        <p>
            Built during Day 18 of my DevOps learning journey.
        </p>

        <div class="badge">
            Dockerfile Custom Image v2
        </div>
    </div>
</body>
</html>
