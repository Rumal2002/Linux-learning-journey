services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - day21-network
    restart: unless-stopped

  client:
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - day21-network

networks:
  day21-network:
    driver: bridge
