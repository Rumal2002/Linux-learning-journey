services:

  frontend:

    build: ./frontend

    container_name: day22-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app-network



  backend:

    build: ./backend

    container_name: day22-backend

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

    environment:

      PORT: 3000

      DB_HOST: database

      DB_PORT: 3306

      DB_USER: appuser

      DB_PASSWORD: apppassword

      DB_NAME: day22db

    networks:
      - app-network



  database:

    image: mysql:8.4

    container_name: day22-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: rootpassword

      MYSQL_DATABASE: day22db

      MYSQL_USER: appuser

      MYSQL_PASSWORD: apppassword

    ports:
      - "3306:3306"

    volumes:

      - mysql-data:/var/lib/mysql

      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword"]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

    networks:
      - app-network



volumes:

  mysql-data:



networks:

  app-network:

    driver: bridge
